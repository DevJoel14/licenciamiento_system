# =============================================================
# Configuracion de PRUEBAS: H2 en memoria, modo MySQL.
# =============================================================
spring.datasource.url=jdbc:h2:mem:licenciamientotest;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

licensing.hmac-secret=test-hmac-secret
licensing.admin-api-key=test-admin-key
licensing.serial.groups=4
licensing.serial.group-length=5
licensing.serial.alphabet=ABCDEFGHJKLMNPQRSTUVWXYZ23456789
licensing.fingerprint.current-version=1
licensing.fingerprint.supported-versions=1
licensing.installer.allow-code=601
licensing.installer.deny-code=602
licensing.offline.enabled=false
licensing.rate-limit.enabled=false
