# =============================================================
# Perfil DEV: H2 en memoria con modo de compatibilidad MySQL.
# Activar con:  --spring.profiles.active=dev
# =============================================================
spring.datasource.url=jdbc:h2:mem:licenciamiento;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Secretos solo para desarrollo local
licensing.hmac-secret=dev-hmac-secret-change-me
licensing.admin-api-key=dev-admin-key-change-me
licensing.rate-limit.enabled=false
