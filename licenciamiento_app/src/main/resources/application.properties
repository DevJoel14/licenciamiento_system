spring.application.name=licenciamiento_app

# =============================================================
# Base de datos central: MySQL 8
# Configuracion LOCAL de desarrollo (usuario root).
# Para produccion mover credenciales a variables de entorno.
# Perfil "dev" (application-dev.properties) usa H2 en memoria.
# =============================================================
# NOTA: credenciales locales (solo desarrollo). No subir a un repositorio publico.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER_NAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# LOCAL: crea/actualiza las tablas automaticamente.
# Para produccion usar 'validate' y aplicar db/schema-mysql.sql.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# =============================================================
# Parametros del sistema de licenciamiento
# =============================================================
# Secreto HMAC-SHA-256 para indexar seriales sin guardarlos en claro.
# OBLIGATORIO en produccion. No dejar el valor por defecto.
licensing.hmac-secret=${LICENSE_HMAC_SECRET:}

# Clave de autenticacion de las operaciones administrativas (cabecera X-Admin-Api-Key).
licensing.admin-api-key=${ADMIN_API_KEY:}

# Formato del serial generado: N grupos de M caracteres alfanumericos.
licensing.serial.groups=${SERIAL_GROUPS:5}
licensing.serial.group-length=${SERIAL_GROUP_LENGTH:5}
licensing.serial.alphabet=ABCDEFGHJKLMNPQRSTUVWXYZ23456789

# Versiones del algoritmo de huella de hardware soportadas por el servidor.
licensing.fingerprint.current-version=1
licensing.fingerprint.supported-versions=1

# Respuestas en texto para Advanced Installer (codigos internos no HTTP).
licensing.installer.allow-code=601
licensing.installer.deny-code=602

# Token offline firmado (permite operar sin conexion durante la ventana de gracia).
licensing.offline.enabled=${OFFLINE_ENABLED:true}
licensing.offline.grace-days=${OFFLINE_GRACE_DAYS:7}
licensing.offline.private-key-path=${OFFLINE_PRIVATE_KEY:keys/offline_private.pem}
licensing.offline.public-key-path=${OFFLINE_PUBLIC_KEY:keys/offline_public.pem}

# Limite de peticiones por IP en endpoints publicos (anti-abuso).
licensing.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
licensing.rate-limit.capacity=${RATE_LIMIT_CAPACITY:60}
licensing.rate-limit.refill-seconds=${RATE_LIMIT_REFILL_SECONDS:60}

# Logging (sin secretos ni seriales completos)
logging.level.com.zaga.licenciamientoapp=INFO
logging.level.org.springframework.web=INFO

# Puerto del servidor. En produccion validar HTTPS a nivel de Spring (ver DESPLIEGUE.md).
server.port=${SERVER_PORT:8086}
